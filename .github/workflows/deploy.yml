name: Deploy Laravel to Netafraz

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, bcmath, ctype, fileinfo, json, openssl, pdo, pdo_mysql, tokenizer, xml, curl
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install lftp
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Deploy Laravel application
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_ROOT_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_ROOT_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true

          open ftp://$FTP_SERVER:$FTP_PORT
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd /

          mirror --reverse --verbose \
            --exclude-glob .env \
            --exclude-glob '.env.*' \
            --exclude-glob '.git/**' \
            --exclude-glob '.github/**' \
            --exclude-glob 'node_modules/**' \
            --exclude-glob 'tests/**' \
            --exclude-glob 'storage/**' \
            --exclude-glob 'public/**' \
            --exclude-glob 'public_html/**' \
            --exclude-glob 'bootstrap/cache/**' \
            --exclude-glob 'database/*.sqlite' \
            ./

          bye
          EOF

      - name: Deploy public files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true

          open ftp://$FTP_SERVER:$FTP_PORT
          user "$FTP_USERNAME" "$FTP_PASSWORD"
          cd /

          mirror --reverse --verbose \
            --exclude-glob 'storage' \
            --exclude-glob 'storage/**' \
            ./public/ /

          bye
          EOF